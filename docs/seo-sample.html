<!DOCTYPE html>
<html lang="ko">

  <!-- ── 검색엔진용: 검색 결과 화면의 두 줄 ──────────────── -->
  <title>MingleUp — 마크다운 지식관리</title>

  <!-- ── OG: 카카오톡·슬랙·디스코드 미리보기 카드 ─────────── -->

  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale"      content="ko_KR">

  <!-- ── 트위터(X) 카드: OG를 읽지만 이 두 줄로 형태 지정 ── -->
  <meta name="twitter:card"  content="summary_large_image">
  <meta name="twitter:title" content="MingleUp — 마크다운 지식관리">

  <!-- ── 아이콘 ─────────────────────────────────────── -->
